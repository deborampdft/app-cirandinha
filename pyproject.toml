[project]
name = "app-cirandinha"
version = "0.1.0"
description = "Análise Grupo Cirandinha Dashboard with Streamlit"
authors = [
    {name = "Debora"}
]
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.29.0",
    "pandas>=2.1.4",
    "openpyxl>=3.1.2",
    "plotly>=5.17.0",
    "xlrd>=2.0.1",
    "lxml>=5.0.0",
    "html5lib>=1.1",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
